<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <title>Layer 1 (back): robot</title>
  <defs>
    <radialGradient id="shell" cx="0.38" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#F6F7F8"/>
      <stop offset="0.6" stop-color="#CBCED3"/>
      <stop offset="1" stop-color="#959AA2"/>
    </radialGradient>
    <radialGradient id="visor" cx="0.4" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#4A525E"/>
      <stop offset="0.55" stop-color="#181B21"/>
      <stop offset="1" stop-color="#07080A"/>
    </radialGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8C9299"/>
      <stop offset="0.28" stop-color="#D9DCE0"/>
      <stop offset="0.62" stop-color="#959AA1"/>
      <stop offset="1" stop-color="#6A6F76"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#70757D"/>
      <stop offset="0.35" stop-color="#A2A7AE"/>
      <stop offset="1" stop-color="#6A6F77"/>
    </linearGradient>
    <linearGradient id="belt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6A6F76"/>
      <stop offset="0.35" stop-color="#4A4E55"/>
      <stop offset="1" stop-color="#24272B"/>
    </linearGradient>
    <radialGradient id="joint" cx="0.55" cy="0.7" r="0.75">
      <stop offset="0" stop-color="#A3A8AE"/>
      <stop offset="1" stop-color="#7D828A"/>
    </radialGradient>
  </defs>

  <!-- neck (mid gray so it no longer fuses with the centre bar at small sizes) -->
  <rect x="43" y="47" width="14" height="12" fill="url(#neck)"/>
  <!-- arms from the torso sides (behind torso); elbow between original and reviewed length -->
  <path d="M25 62 L21.75 87.75 L15 81 M75 62 L78.25 87.75 L85 81" fill="none" stroke="#6A6F77" stroke-width="9.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M25 62 L21.75 87.75 L15 81 M75 62 L78.25 87.75 L85 81" fill="none" stroke="#B4B9BF" stroke-width="8.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="21.75" cy="87.75" r="3.5" fill="url(#joint)"/>
  <circle cx="78.25" cy="87.75" r="3.5" fill="url(#joint)"/>
  <!-- torso -->
  <path d="M39.5 90 H60.5 L60 104 H40 Z" fill="url(#shell)" stroke="#6A6F77" stroke-width="0.7" stroke-linejoin="round"/>
  <path d="M33 57 Q50 53 67 57 C73 59 74.2 66 72.8 74 C71.4 81 66.5 86.2 60 88 H40 C33.5 86.2 28.6 81 27.2 74 C25.8 66 27 59 33 57 Z" fill="url(#shell)" stroke="#6A6F77" stroke-width="0.7" stroke-linejoin="round"/>
  <rect x="37.5" y="86" width="25" height="5" rx="2.2" fill="url(#belt)"/>
  <!-- shoulder armor plates -->
  <path d="M37 57.5 C32 56.3 25.5 56.3 22.3 58.4 C20.1 60 19.7 63.5 20.4 66.4 C24.8 64.5 30.5 64.2 35 65 C36.5 62.8 37.2 60.2 37 57.5 Z" fill="url(#shell)" stroke="#6A6F77" stroke-width="0.7" stroke-linejoin="round"/>
  <path d="M63 57.5 C68 56.3 74.5 56.3 77.7 58.4 C79.9 60 80.3 63.5 79.6 66.4 C75.2 64.5 69.5 64.2 65 65 C63.5 62.8 62.8 60.2 63 57.5 Z" fill="url(#shell)" stroke="#6A6F77" stroke-width="0.7" stroke-linejoin="round"/>
  <!-- ears: side-on disc + cap -->
  <rect x="21" y="25" width="5" height="12" rx="2.4" fill="url(#disc)"/>
  <rect x="24.2" y="21.5" width="5" height="19" rx="2" fill="url(#disc)"/>
  <rect x="74" y="25" width="5" height="12" rx="2.4" fill="url(#disc)"/>
  <rect x="70.8" y="21.5" width="5" height="19" rx="2" fill="url(#disc)"/>
  <!-- head -->
  <rect x="28" y="11" width="44" height="39" rx="16" fill="url(#shell)" stroke="#6A6F77" stroke-width="0.8"/>
  <rect x="32.5" y="18.5" width="35" height="25" rx="9" fill="url(#visor)"/>
  <!-- face: slightly larger eyes, heavier and wider frown so it survives the centre bar -->
  <path d="M36.5 25.5 L46.6 29.5 V34.5 H36.5 Z" fill="#3FC3FF"/>
  <path d="M63.5 25.5 L53.4 29.5 V34.5 H63.5 Z" fill="#3FC3FF"/>
  <path d="M43 40.2 Q50 36.2 57 40.2" fill="none" stroke="#3FC3FF" stroke-width="2.8" stroke-linecap="round"/>
</svg>
