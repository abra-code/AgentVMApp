<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <title>Layer 2 (front): bars and hands</title>
  <defs>
    <radialGradient id="shell" cx="0.38" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#F6F7F8"/>
      <stop offset="0.6" stop-color="#CBCED3"/>
      <stop offset="1" stop-color="#959AA2"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F3237"/>
      <stop offset="0.32" stop-color="#8E949D"/>
      <stop offset="0.6" stop-color="#585D65"/>
      <stop offset="1" stop-color="#26292E"/>
    </linearGradient>
  </defs>
  <!-- palms (behind bars) -->
  <rect x="9" y="68" width="11.5" height="16" rx="5" fill="#AEB3B9" stroke="#6A6F77" stroke-width="0.6"/>
  <rect x="79.5" y="68" width="11.5" height="16" rx="5" fill="#AEB3B9" stroke="#6A6F77" stroke-width="0.6"/>
  <!-- bars (6 wide; centred at 15 / 50 / 85) -->
  <rect x="12" y="-2" width="6" height="104" fill="url(#bar)"/>
  <rect x="47" y="-2" width="6" height="104" fill="url(#bar)"/>
  <rect x="82" y="-2" width="6" height="104" fill="url(#bar)"/>
  <!-- two fingers + thumb per hand (over bars) -->
  <g fill="url(#shell)" stroke="#6A6F77" stroke-width="0.6">
    <rect x="9" y="71" width="13.5" height="5.2" rx="2.6"/>
    <rect x="9" y="76.4" width="13" height="5.2" rx="2.6"/>
    <rect x="9.5" y="66" width="9.5" height="4.6" rx="2.3" transform="rotate(14 14.25 68.3)"/>
    <rect x="77.5" y="71" width="13.5" height="5.2" rx="2.6"/>
    <rect x="78" y="76.4" width="13" height="5.2" rx="2.6"/>
    <rect x="81" y="66" width="9.5" height="4.6" rx="2.3" transform="rotate(-14 85.75 68.3)"/>
  </g>
</svg>
